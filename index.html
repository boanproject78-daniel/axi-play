<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AXI PLAY 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* AXI PLAY: bemill식 화이트 캔버스 + 블루 포인트 + 다크 필 버튼. 이미지형 카드 그리드, 상세는 좌측 콘텐츠/우측 고정 옵션 패널 */
  --bg:#FFFFFF; --surface:#F4F6F9; --ink:#14171C; --muted:#5F6672; --line:#E3E6EB;
  --primary:#2160F3; --primary-ink:#FFFFFF; --primary-soft:#EAF0FF; --dark:#17191E;
  --good:#167A3E; --good-soft:#E6F4EC; --warn:#A35A06; --warn-soft:#FFF3E0; --bad:#C62828; --bad-soft:#FDECEC;
  --gold:#B8862B;
  --f-body:"Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
  --f-logo:"Montserrat", var(--f-body);
  --r:12px; --wrap:1180px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* proto bar */
.proto{background:var(--dark);color:#D7DAE0;font-size:12px}
.proto .wrap{display:flex;gap:12px;justify-content:space-between;align-items:center;min-height:30px;flex-wrap:wrap}
.proto button{background:none;border:0;color:#fff;text-decoration:underline;font-size:12px;padding:4px 0}

/* header */
.hdr{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);transition:background .35s,border-color .35s,color .35s}
.hdr.over{background:transparent;backdrop-filter:none;border-color:transparent;color:#fff}
.hdr.over .logo b{color:#A9C2FF}
.hdr.over .search{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:#fff}
.hdr.over .search input::placeholder{color:rgba(255,255,255,.7)}
.hdr.over .hdr-nav button{color:rgba(255,255,255,.78)}
.hdr.over .hdr-nav button:hover,.hdr.over .hdr-nav button.on{color:#fff}
.hdr.over .sel{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.26);color:#fff}
.hdr.over .sel option{color:#14171C}
.hdr.over .btn-text,.hdr.over .icon-btn{color:#fff}
.hdr.over .icon-btn:hover{background:rgba(255,255,255,.12)}
.hdr.over .pill-dark{background:#fff;color:var(--dark)}
.hdr-in{display:flex;align-items:center;gap:20px;height:64px}
.logo{font-family:var(--f-logo);font-weight:800;font-size:22px;letter-spacing:-.5px;background:none;border:0;padding:0;display:flex;align-items:baseline;gap:4px;white-space:nowrap}
.logo b{color:var(--primary);font-weight:800}
.search{flex:1;max-width:400px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:0 14px;height:40px;background:var(--surface)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:14px}
.hdr-nav{display:flex;gap:4px}
.hdr-nav button{background:none;border:0;padding:8px 12px;border-radius:8px;font-weight:500;color:var(--muted)}
.hdr-nav button.on,.hdr-nav button:hover{color:var(--ink)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.sel{border:1px solid var(--line);border-radius:999px;background:#fff;height:36px;padding:0 10px;font-size:13px}
.icon-btn{position:relative;width:40px;height:40px;border-radius:999px;border:0;background:none;display:grid;place-items:center}
.icon-btn:hover{background:var(--surface)}
.badge{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--primary);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.btn-text{background:none;border:0;font-size:14px;padding:8px 6px;color:var(--ink)}
.pill-dark{background:var(--dark);color:#fff;border:0;border-radius:999px;height:36px;padding:0 16px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pill-dark:hover{background:#000}

/* buttons */
.btn{border-radius:999px;border:1px solid transparent;height:48px;padding:0 22px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--primary);color:var(--primary-ink)}
.btn-primary:hover{background:#1A52D6}
.btn-outline{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-outline:hover{border-color:#C5CAD3}
.btn-block{width:100%}
.btn-sm{height:36px;padding:0 14px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;color:var(--ink);white-space:nowrap}
.chip:hover{border-color:#C5CAD3}
.chip.on{background:var(--dark);border-color:var(--dark);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;border-radius:999px;padding:3px 10px;background:var(--surface);color:var(--muted)}
.tag.blue{background:var(--primary-soft);color:var(--primary)}
.tag.dark{background:var(--dark);color:#fff}

/* layout */
main{min-height:60vh;padding-bottom:96px}
.section{padding:40px 0 8px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.sec-head h2{font-size:24px;font-weight:900;letter-spacing:-.5px}
.sec-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.link{background:none;border:0;color:var(--muted);font-size:14px;padding:4px}
.link:hover{color:var(--ink)}

/* hero */
.hero{position:relative;height:420px;overflow:hidden;background:#0B1020}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block}
.slide .art{position:absolute;inset:0}
.slide .cap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding-bottom:56px;color:#fff}
.slide .cap h1{font-size:40px;font-weight:900;line-height:1.2;letter-spacing:-1px;max-width:640px}
.slide .cap p{margin:0;font-size:16px;opacity:.9;max-width:560px}
.hero-ctrl{position:absolute;z-index:3;right:20px;bottom:24px;display:flex;align-items:center;gap:8px;color:#fff;font-size:13px}
.hero-ctrl button{width:36px;height:36px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.25);color:#fff}

/* hero: 3D poster switcher */
.hx{position:relative;margin-top:-64px;height:max(640px,min(920px,calc(100vh - 30px)));overflow:hidden;color:#fff;background:radial-gradient(circle at 58% 52%,var(--h-in) 0%,var(--h-mid) 48%,var(--h-out) 100%);isolation:isolate}
.hx-fx{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.hx-in{position:relative;z-index:2;height:100%;display:flex;justify-content:space-between;align-items:stretch;padding-top:112px;padding-bottom:48px}
.hx-left{position:relative;z-index:3;max-width:430px;display:flex;flex-direction:column;justify-content:center;gap:16px;transition:opacity .35s,transform .35s}
.hx-left.out,.hx-word.out{opacity:0;transform:translateX(-18px)}
.hx-tag{align-self:flex-start;font-size:13px;border-radius:999px;padding:5px 12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px)}
.hx-eng{font-family:var(--f-logo);font-weight:700;font-size:12px;letter-spacing:3px;color:var(--h-acc)}
.hx-title{font-weight:900;font-size:clamp(36px,4.4vw,64px);line-height:1.1;letter-spacing:-1.5px}
.hx-title-2{display:block;font-size:.46em;font-weight:700;letter-spacing:-.4px;margin-top:10px;opacity:.92}
.hx-sub{margin:0;opacity:.78;max-width:360px}
.hx-cta{display:inline-flex;align-items:center;gap:18px;height:54px;padding:0 7px 0 24px;border-radius:999px;border:0;background:rgba(0,0,0,.42);color:#fff;font-weight:700;font-size:15px;transition:transform .25s,background .25s}
.hx-cta:hover{background:rgba(0,0,0,.62);transform:translateY(-3px)}
.hx-plus{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--h-acc);color:#14171C;font-size:22px;font-weight:900;line-height:1;padding-bottom:2px}
.hx-badge{display:flex;align-items:center;gap:12px;margin-top:18px;font-size:13px;opacity:.9}
.hx-badge-i{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:var(--h-acc);font-size:18px}
.hx-center{position:absolute;inset:0;z-index:2;display:grid;place-items:center;perspective:1200px;pointer-events:none;padding-top:64px}
.hx-card{pointer-events:auto;position:relative;width:clamp(220px,24vw,320px);aspect-ratio:3/4;border:0;padding:0;background:none;border-radius:20px;transform-style:preserve-3d;will-change:transform,filter;box-shadow:0 50px 90px rgba(0,0,0,.45)}
.hx-card-in{position:absolute;inset:0;border-radius:20px;overflow:hidden}
.hx-card-in .poster{height:100%;aspect-ratio:auto;border-radius:20px}
.hx-card-in::after{content:"";position:absolute;inset:0;border-radius:20px;border:1px solid rgba(255,255,255,.28);pointer-events:none}
.hx-gloss{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--gx,35%) var(--gy,22%),rgba(255,255,255,.38),rgba(255,255,255,0) 46%);mix-blend-mode:soft-light}
.hx-right{position:relative;z-index:3;width:min(450px,38vw);display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:20px}
.hx-cards{display:flex;gap:10px}
.hx-mini{width:clamp(76px,7vw,100px);display:flex;flex-direction:column;gap:6px;padding:8px 8px 10px;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);backdrop-filter:blur(10px);color:#fff;text-align:left;transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .25s,border-color .25s}
.hx-mini:hover{transform:translateY(-6px);background:rgba(255,255,255,.13)}
.hx-mini.on{border-color:var(--h-acc);background:rgba(255,255,255,.15)}
.hx-mini-p .poster{border-radius:10px}
.hx-mini-t{font-size:12px;font-weight:700;line-height:1.3}
.hx-mini-s{font-size:11px;opacity:.75}
.hx-nav{display:flex;align-items:center;gap:12px;font-size:13px}
.hx-nav button{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff}
.hx-nav button:hover{background:rgba(255,255,255,.16)}
.hx-word{font-family:var(--f-logo);font-weight:800;font-size:clamp(64px,9vw,150px);line-height:.85;letter-spacing:-2px;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.6);transition:opacity .35s,transform .35s;white-space:nowrap}
@media (max-width:900px){
  .hx{height:auto}
  .hx-in{flex-direction:column;padding-top:96px;padding-bottom:32px;gap:24px}
  .hx-left{max-width:none}
  .hx-center{position:relative;inset:auto;height:330px;padding-top:0}
  .hx-card{width:210px}
  .hx-right{width:100%;align-items:stretch}
  .hx-cards{overflow-x:auto;padding:6px 2px}
  .hx-mini{flex:none;width:96px}
  .hx-nav{justify-content:center}
  .hx-word{display:none}
}

/* poster art */
.poster{position:relative;overflow:hidden;border-radius:var(--r);aspect-ratio:3/4;color:#fff;isolation:isolate}
.poster .shape{position:absolute;border-radius:50%;z-index:-1}
.poster .p-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.poster .p-scrim{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.62) 100%)}
.tk-top .p-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;opacity:.55}
.poster .p-region{position:absolute;top:12px;left:12px}
.poster .p-title{position:absolute;left:14px;right:14px;bottom:14px;font-weight:900;font-size:19px;line-height:1.25;letter-spacing:-.4px}
.poster .p-eng{display:block;font-family:var(--f-logo);font-size:11px;letter-spacing:1.5px;opacity:.8;margin-bottom:6px;font-weight:700}

/* cards */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 20px}
.card{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:10px;color:inherit}
.card:hover .poster{transform:translateY(-3px)}
.card .poster{transition:transform .2s}
.card .meta{display:flex;flex-direction:column;gap:3px}
.card .cat{font-size:13px;color:var(--muted)}
.card .ttl{font-weight:700;font-size:16px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .rate{font-size:13px;color:var(--muted)}
.card .rate b{color:var(--ink)}
.card .price{font-weight:700;font-size:16px}
.card .price small{font-weight:400;color:var(--muted);font-size:13px}
.empty{padding:48px;text-align:center;color:var(--muted);background:var(--surface);border-radius:var(--r)}

/* tabs underline */
.utabs{display:flex;gap:24px;border-bottom:1px solid var(--line);overflow-x:auto}
.utabs button{background:none;border:0;padding:12px 2px;font-size:16px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.utabs button.on{color:var(--ink);font-weight:700;border-color:var(--ink)}

/* banners */
.banners{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}
.banner{border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:10px;min-height:200px;justify-content:space-between;border:0;text-align:left}
.banner h3{font-size:22px;font-weight:900;line-height:1.3}
.banner p{margin:0;font-size:14px}
.banner.pkg{background:var(--primary);color:#fff}
.banner.mem{background:var(--dark);color:#fff}
.banner .sub{opacity:.85}
.regions-mini{display:flex;gap:8px;flex-wrap:wrap}
.regions-mini span{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 12px;font-size:13px}
.regions-mini span.done{background:#fff;color:var(--dark);border-color:#fff;font-weight:700}

/* hscroll goods */
.hlist{display:grid;grid-auto-flow:column;grid-auto-columns:220px;gap:16px;overflow-x:auto;padding-bottom:8px}
.gthumb{aspect-ratio:1/1;border-radius:var(--r);display:grid;place-items:center;position:relative;overflow:hidden}
.gcard{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px}

/* detail */
.d-top{padding:28px 0 0}
.d-title{font-size:30px;font-weight:900;letter-spacing:-.8px;color:var(--primary);line-height:1.3}
.d-sub{color:var(--muted);margin:6px 0 14px}
.d-wrap{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:40px;align-items:start;margin-top:24px}
.d-hero{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.d-hero .poster{aspect-ratio:auto;min-height:340px}
.d-hero .poster.small{min-height:164px}
.d-hero .stack{display:grid;gap:12px}
.d-sec{padding:32px 0;border-bottom:1px solid var(--line)}
.d-sec h3{font-size:22px;font-weight:900;margin-bottom:14px;color:var(--primary)}
.d-sec h4{font-size:16px;margin:18px 0 8px}
.d-sec ul{margin:0;padding-left:18px}
.d-sec li{margin:4px 0}
.mapbox{height:220px;border-radius:var(--r);background:var(--surface);border:1px dashed #C9CED6;display:grid;place-items:center;color:var(--muted);text-align:center}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left}
table.t th{background:var(--surface);font-weight:700}
.review{padding:14px 0;border-bottom:1px solid var(--line)}
.review .who{font-size:13px;color:var(--muted)}
.stars{color:#F5A400;letter-spacing:1px}

/* option panel */
.panel{position:sticky;top:84px;background:var(--surface);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:18px}
.panel h3{font-size:19px;font-weight:900;display:flex;align-items:center;gap:8px}
.notice{background:var(--primary-soft);color:var(--primary);border-radius:10px;padding:10px 12px;font-size:13px;text-align:center}
.p-label{font-weight:700;font-size:15px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.p-label small{font-weight:400;color:var(--muted);font-size:13px}
.dates{display:grid;grid-auto-flow:column;grid-auto-columns:56px;gap:8px;overflow-x:auto;padding-bottom:4px}
.date{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:0;font-size:12px;color:var(--muted)}
.date b{font-size:17px;color:var(--ink)}
.date.sun b{color:var(--bad)}
.date.on{background:var(--dark);border-color:var(--dark);color:#D7DAE0}
.date.on b{color:#fff}
.date:disabled{opacity:.4}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted)}
.slot b{font-size:15px;color:var(--ink)}
.slot .few{color:var(--warn);font-weight:700}
.slot.on{border-color:var(--primary);background:var(--primary-soft)}
.slot.on b{color:var(--primary)}
.slot:disabled{background:var(--surface);opacity:.6;cursor:not-allowed}
.slot:disabled b{text-decoration:line-through;color:var(--muted)}
.types{display:flex;flex-wrap:wrap;gap:8px}
.type{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;display:flex;gap:14px;font-size:14px}
.type .pr{color:var(--primary);font-weight:700}
.type.on{border-color:var(--primary)}
.qrow{background:#fff;border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.qrow .nm{font-weight:700;font-size:14px}
.stepper{display:inline-flex;align-items:center;background:var(--dark);color:#fff;border-radius:999px;height:36px}
.stepper button{width:36px;height:36px;border:0;background:none;color:#fff;font-size:18px;border-radius:999px}
.stepper span{min-width:22px;text-align:center;font-weight:700}
.stepper.light{background:#fff;color:var(--ink);border:1px solid var(--line)}
.stepper.light button{color:var(--ink)}
.x{width:32px;height:32px;border-radius:999px;border:0;background:var(--surface);display:grid;place-items:center}
.total{display:flex;justify-content:flex-end;align-items:baseline;gap:10px;border-top:1px solid var(--line);padding-top:16px;font-weight:700}
.total .v{font-size:30px;color:var(--primary);font-weight:900}
.info dl{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;margin:0;font-size:14px}
.info dt{color:var(--primary)}
.info dd{margin:0}
.addon{background:#fff;border-radius:14px;padding:12px;display:flex;align-items:center;gap:12px}
.addon .gthumb{width:52px;height:52px;flex:none;border-radius:10px}
.addon .tx{flex:1;min-width:0;font-size:13px}
.addon .tx b{display:block;font-size:14px}
.addon .tx span{color:var(--muted)}
.legal{display:flex;justify-content:center;gap:14px;font-size:12px;color:var(--muted)}

/* store */
.store-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 20px}

/* cart / checkout */
.two{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:32px;align-items:start}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
.box h3{font-size:18px;font-weight:900;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.box + .box{margin-top:16px}
.line-item{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line);align-items:flex-start}
.line-item:first-of-type{border-top:0;padding-top:0}
.line-item .thumb{width:64px;height:84px;flex:none}
.line-item .thumb .poster,.line-item .thumb .gthumb{width:100%;height:100%;aspect-ratio:auto;border-radius:10px}
.line-item .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.line-item .body b{font-size:15px}
.line-item .body span{font-size:13px;color:var(--muted)}
.line-item .amt{font-weight:700;white-space:nowrap}
.line-item .ck{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--primary)}
.line-item.off .thumb,.line-item.off .body,.line-item.off .amt{opacity:.45}
.del{width:32px;height:32px;border-radius:999px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--muted)}
.del:hover{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.cart-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 18px;margin-bottom:16px}
.cart-bar .check{align-items:center;font-weight:700}
.cart-bar .acts{display:flex;gap:8px}
.trow{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.trow .nm{min-width:44px}
.toast button{background:none;border:0;color:#8FB0FF;font-weight:700;margin-left:12px;text-decoration:underline}
.sum{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.sum.big{font-size:18px;font-weight:900;border-top:1px solid var(--line);margin-top:8px;padding-top:14px}
.sum.big .v{color:var(--primary)}
.sum .minus{color:var(--bad)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted)}
.input{height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;width:100%}
.radios{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.radio{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 6px;font-size:13px;font-weight:500;text-align:center}
.radio.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:700}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--primary)}
.group-label{font-size:13px;font-weight:700;color:var(--muted);margin:18px 0 8px;display:flex;align-items:center;gap:6px}
.group-label:first-child{margin-top:0}
.fx{font-size:12px;color:var(--muted);margin-top:6px}

/* done */
.done{max-width:560px;margin:56px auto;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.done .ok{width:64px;height:64px;border-radius:999px;background:var(--primary);display:grid;place-items:center}
.done h1{font-size:28px;font-weight:900}

/* tickets */
.tk-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.tk{border-radius:20px;background:#fff;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.tk-top{padding:20px 22px;color:#fff;position:relative;overflow:hidden;isolation:isolate}
.tk-top .shape{position:absolute;border-radius:50%;z-index:-1}
.tk-top h3{font-size:19px;font-weight:900;line-height:1.3}
.tk-top .when{font-size:14px;opacity:.92;margin-top:6px}
.tk-body{padding:20px 22px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;position:relative;border-top:2px dashed var(--line)}
.qrbox{width:156px;display:flex;flex-direction:column;align-items:center;gap:6px}
.qrbox canvas{width:148px;height:148px;image-rendering:pixelated;border-radius:6px}
.qrbox .cd{font-size:12px;color:var(--muted)}
.qrbox.used canvas{opacity:.15}
.tk-meta{display:flex;flex-direction:column;gap:6px;font-size:14px}
.tk-meta .code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--surface);border-radius:6px;padding:3px 8px;align-self:flex-start}
.tk-extra{padding:0 22px 20px;display:flex;flex-direction:column;gap:8px}
.tk-extra .row{display:flex;justify-content:space-between;align-items:center;font-size:13px;background:var(--surface);border-radius:10px;padding:8px 12px}
.st{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;align-self:flex-start;white-space:nowrap}
.st.ready{background:var(--primary-soft);color:var(--primary)}
.st.used{background:var(--surface);color:var(--muted)}
.st.ok{background:var(--good-soft);color:var(--good)}

/* my */
.mem-card{background:var(--dark);color:#fff;border-radius:20px;padding:28px;display:grid;grid-template-columns:1fr auto;gap:20px}
.mem-card .g{font-family:var(--f-logo);font-size:34px;font-weight:800;color:#F2C14E;letter-spacing:1px}
.bar{height:8px;background:rgba(255,255,255,.18);border-radius:8px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:#F2C14E}
.pts{text-align:right}
.pts .v{font-size:30px;font-weight:900}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.grade{border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px}
.grade b{display:block;font-family:var(--f-logo);font-size:15px}
.grade.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.my-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.visit{display:flex;gap:10px}
.visit div{flex:1;border-radius:12px;padding:12px;text-align:center;border:1px dashed #C9CED6;font-size:13px;color:var(--muted)}
.visit div.done{border:1px solid var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:700}

/* scan */
.scan-wrap{max-width:640px;margin:32px auto}
.scan-result{border-radius:16px;padding:22px;margin-top:16px;display:flex;flex-direction:column;gap:6px}
.scan-result h3{font-size:22px;font-weight:900}
.scan-result.ok{background:var(--good-soft);color:var(--good)}
.scan-result.warn{background:var(--warn-soft);color:var(--warn)}
.scan-result.bad{background:var(--bad-soft);color:var(--bad)}
.scan-result .detail{color:var(--ink);font-size:14px}

/* footer */
footer{border-top:1px solid var(--line);background:var(--surface);padding:32px 0 40px;font-size:13px;color:var(--muted)}
footer .wrap{display:flex;flex-direction:column;gap:12px}
footer nav{display:flex;gap:16px;flex-wrap:wrap}
footer nav button{background:none;border:0;padding:0;color:var(--ink);font-size:13px}

/* modal / toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,12,16,.5);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:20px;width:min(520px,100%);max-height:88vh;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
.modal-h{display:flex;justify-content:space-between;align-items:center}
.modal-h h3{font-size:20px;font-weight:900}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2)}

/* bottom tab (mobile) */
.tabbar{display:none}

@media (max-width:1020px){
  .grid,.store-grid{grid-template-columns:repeat(3,1fr)}
  .d-wrap,.two{grid-template-columns:1fr}
  .panel{position:static}
  .hdr-nav{display:none}
}
@media (max-width:720px){
  .grid,.store-grid{grid-template-columns:repeat(2,1fr);gap:22px 12px}
  .search{display:none}
  .hdr-r .sel.region,.hdr-r .btn-text,.hdr-r .pill-dark{display:none}
  .hdr-r .sel{max-width:96px}
  .hero{height:360px}
  .slide .cap h1{font-size:28px}
  .banners,.my-grid,.tk-grid{grid-template-columns:1fr}
  .d-hero{grid-template-columns:1fr}
  .d-hero .stack{display:none}
  .tk-body{grid-template-columns:1fr;justify-items:center}
  .radios{grid-template-columns:repeat(2,1fr)}
  .grades{grid-template-columns:repeat(2,1fr)}
  .mem-card{grid-template-columns:1fr}
  .pts{text-align:left}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{background:none;border:0;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
  .tabbar button.on{color:var(--ink);font-weight:700}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function remain(cid,date,slot){const cap=cid==="prism"?24:40;const r=(hash(cid+date+slot)%(cap+12))-10;return Math.max(0,Math.min(cap,r))}
const WD={ko:["일","월","화","수","목","금","토"],en:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],ja:["日","月","火","水","木","金","土"],zh:["日","一","二","三","四","五","六"]};
function fmtDate(s){const d=new Date(s+"T00:00:00");const wd=(WD[S.lang]||WD.en)[d.getDay()];return S.lang==="ko"||S.lang==="ja"||S.lang==="zh"?`${d.getMonth()+1}.${d.getDate()} (${wd})`:`${wd}, ${d.toLocaleDateString("en",{month:"short",day:"numeric"})}`}

function posterHTML(o,{region=true,big=false}={}){

  const s1=big?420:220,s2=big?260:140;
  if(o.img)return `<div class="poster" style="background:${c}">
    <img class="p-img" src="${o.img}" alt="" loading="lazy" style="object-position:${o.imgPos||"50% 50%"}">
    ${o.title&&L(o.title)?`<span class="p-scrim"></span>`:""}
    ${region&&o.region?`<span class="p-region tag dark">${esc(L(REG[o.region]))}</span>`:""}
    <div class="p-title" style="${big?"font-size:28px":""}"><span class="p-eng">${esc(o.eng||"")}</span>${esc(L(o.title))}</div>
  </div>`;
  return `<div class="poster" style="background:${c}">
    <span class="shape" style="width:${s1}px;height:${s1}px;right:-${s1*.35}px;top:-${s1*.25}px;background:${b};opacity:.55"></span>
    <span class="shape" style="width:${s2}px;height:${s2}px;left:-${s2*.3}px;bottom:${big?70:46}px;border:${big?3:2}px solid ${a};opacity:.9"></span>
    <span class="shape" style="width:${big?40:22}px;height:${big?40:22}px;right:${big?60:28}px;bottom:${big?150:92}px;background:${a}"></span>
    ${region&&o.region?`<span class="p-region tag dark">${esc(L(REG[o.region]))}</span>`:""}
    <div class="p-title" style="${big?"font-size:28px":""}"><span class="p-eng">${esc(o.eng||"")}</span>${esc(L(o.title))}</div>
  </div>`}

/* cart helpers */
function lineAmount(i){
  if(i.kind==="ticket"){const c=byId(i.contentId);return c.prices.reduce((a,p)=>a+(i.qty[p.k]||0)*p.p,0)}
  return prodById(i.pid).p*i.qty}
function lineHTML(i,idx,editable=true,exclude=false){
  let thumb,title,sub;
  if(i.kind==="ticket"){const c=byId(i.contentId);thumb=posterHTML({...c,title:{ko:"",en:""},eng:""},{region:false});title=L(c.title);
    sub=`${c.type==="slot"?fmtDate(i.date)+" "+i.slot:t("anytime")} · ${L(REG[c.region])}`}
  else{const p=prodById(i.pid);thumb=gthumbHTML(p);title=L(p.name);
    sub=[i.opt?L(i.opt):"",i.kind==="pkg"?(i.date?fmtDate(i.date)+" "+(i.slot||""):t("anytime")):i.receive==="ship"?t("ship"):`${i.kind==="fnb"?t("fnbPickup"):t("pickup")} · ${L(VENUE[i.venue])}${i.date?" · "+fmtDate(i.date):""}`].filter(Boolean).join(" · ")}
  const step=(act,extra,val)=>`<div class="stepper light" style="height:32px"><button style="height:32px;width:32px" data-act="${act}" data-v="${idx}" ${extra} data-d="-1" aria-label="-">−</button><span class="num">${val}</span><button style="height:32px;width:32px" data-act="${act}" data-v="${idx}" ${extra} data-d="1" aria-label="+">+</button></div>`;
  let qtyUI="";
  if(editable){
    if(i.kind==="ticket"){const c=byId(i.contentId);qtyUI=`<div style="display:flex;flex-direction:column;gap:6px;margin-top:6px">${c.prices.filter(p=>i.qty[p.k]).map(p=>`<div class="trow"><span class="nm">${esc(L(p.n))}</span>${step("tqty",`data-t="${p.k}"`,i.qty[p.k])}<span class="num">${won(p.p*i.qty[p.k])}</span></div>`).join("")}</div>`}
    else qtyUI=`<div style="margin-top:6px;align-self:flex-start">${step("cqty","",i.qty)}</div>`}
  else if(i.kind==="ticket"){const c=byId(i.contentId);sub+=" · "+c.prices.filter(p=>i.qty[p.k]).map(p=>L(p.n)+" "+i.qty[p.k]).join(", ")}
  else if(i.qty>1)sub+=` · x${i.qty}`;
  return `<div class="line-item ${i.off&&editable?"off":""}">
   ${editable?`<input type="checkbox" class="ck" data-change="ck" data-v="${idx}" ${i.off?"":"checked"} aria-label="${esc(title)} ${t("selItem")}">`:""}
   <div class="thumb">${thumb}</div><div class="body"><b>${esc(title)}</b><span>${esc(sub)}</span>${qtyUI}</div>
   <div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px">${editable?`<button class="del" data-act="cdel" data-v="${idx}" aria-label="${esc(title)} ${t("remove")}" title="${t("remove")}">${I.x}</button>`:exclude?`<button class="del" data-act="cexcl" data-v="${idx}" aria-label="${esc(title)} ${t("exclude")}" title="${t("exclude")}">${I.x}</button>`:""}<span class="amt num">${won(lineAmount(i))}</span></div></div>`}
function groups(){
  const g={ticket:[],pkg:[],onsite:[],ship:[]};
  S.cart.forEach((i,idx)=>{if(i.kind==="ticket")g.ticket.push([i,idx]);else if(i.kind==="pkg")g.pkg.push([i,idx]);else if(i.receive==="ship")g.ship.push([i,idx]);else g.onsite.push([i,idx])});return g}
const act=()=>S.cart.filter(i=>!i.off);
function totals(){
  const items=act().reduce((a,i)=>a+lineAmount(i),0);
  const ship=act().some(i=>i.receive==="ship")?3000:0;
  const cp=COUPONS.find(c=>c.id===S.coupon);let cd=0;
  if(cp&&items>=cp.min)cd=cp.amt?cp.amt:Math.min(cp.max,Math.floor(items*cp.pct/100));
  const maxPts=Math.max(0,Math.min(S.member.points,items+ship-cd));
  const pts=Math.min(S.usePoints,maxPts);
  const pay=items+ship-cd-pts;
  const rate=(GRADES.find(g=>g.k===S.member.grade)||GRADES[0]).rate;
  return{items,ship,cd,pts,pay,maxPts,earn:Math.floor((items-cd-pts)*rate/100),rate}}

/* ---------------- QR (prototype pattern) ---------------- */
function drawQR(cv,code,win){
  const ctx=cv.getContext("2d"),n=29;ctx.fillStyle="#fff";ctx.fillRect(0,0,n,n);ctx.fillStyle="#111";
  let h=hash(code+"|"+win);const rnd=()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return (h>>>0)/4294967296};
  const fin=(x,y)=>{for(let i=0;i<7;i++)for(let j=0;j<7;j++){const e=i===0||i===6||j===0||j===6||(i>=2&&i<=4&&j>=2&&j<=4);if(e)ctx.fillRect(x+i,y+j,1,1)}};
  const inF=(x,y)=>(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);
  for(let x=0;x<n;x++)for(let y=0;y<n;y++){if(inF(x,y))continue;if(rnd()<.48)ctx.fillRect(x,y,1,1)}
  fin(0,0);fin(n-7,0);fin(0,n-7)}
function paintQRs(){
  const now=Date.now(),win=Math.floor(now/60000),left=60-Math.floor((now/1000)%60);
  document.querySelectorAll("canvas[data-qr]").forEach(cv=>{if(cv.dataset.win!==String(win)){drawQR(cv,cv.dataset.qr,win);cv.dataset.win=win}
    const cd=cv.parentElement.querySelector("[data-cd]");if(cd&&!cv.parentElement.classList.contains("used"))cd.textContent=`${left}${t("refreshIn")}`})}
setInterval(()=>{if(S.view==="tickets")paintQRs()},1000);

/* ---------------- hero: 3D poster switcher ---------------- */
const HERO_IDS=["king","lumen","manpa","deepblue"];
const FXTYPE={king:"ember",lumen:"light",manpa:"wave",deepblue:"bubble"};
const hx2rgb=h=>{h=h.replace("#","");return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]};
const rgba=(h,a)=>{const[r,g,b]=hx2rgb(h);return `rgba(${r},${g},${b},${a})`};
const mix=(a,b,p)=>{const A=hx2rgb(a),B=hx2rgb(b);return "#"+A.map((v,i)=>Math.round(v+(B[i]-v)*p).toString(16).padStart(2,"0")).join("")};
const heroCol=c=>({in:c.c3,mid:c.c1,out:mix(c.c1,"#000000",.8),acc:c.c2});
const EASE={in2:p=>p*p,inOut2:p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2,back:p=>{const s=1.1,c=s+1;return 1+c*Math.pow(p-1,3)+s*Math.pow(p-1,2)}};
function tween(d,ease,fn){return new Promise(res=>{const t0=performance.now();const st=now=>{const p=Math.min(1,(now-t0)/d);fn(ease(p));if(p<1)requestAnimationFrame(st);else res()};requestAnimationFrame(st)})}
function heroTextHTML(c){

const Hero={el:null,cv:null,ctx:null,card:null,w:0,h:0,dpr:1,parts:[],orbs:[],type:"light",c:null,
  mouse:{x:0,y:0,px:-9999,py:-9999},cur:{x:0,y:0},spin:0,blur:0,alpha:1,mode:"float",switching:false,hover:false,lastAuto:0,raf:0,reduce:false,
  mount(){
    const el=document.getElementById("hx");this.el=el;if(!el)return;
    this.cv=el.querySelector(".hx-fx");this.ctx=this.cv.getContext("2d");this.card=el.querySelector("#hxCard");
    this.reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const c=byId(HERO_IDS[S.heroIdx%HERO_IDS.length]);
    this.resize(!this.c||this.c.id!==c.id);
    if(!this.lastAuto)this.lastAuto=performance.now();
    el.onpointermove=e=>{if(e.pointerType!=="mouse")return;const r=el.getBoundingClientRect();this.mouse.x=(e.clientX-r.left)/r.width-.5;this.mouse.y=(e.clientY-r.top)/r.height-.5;this.mouse.px=e.clientX-r.left;this.mouse.py=e.clientY-r.top};
    el.onpointerenter=e=>{if(e.pointerType==="mouse")this.hover=true};
    el.onpointerleave=()=>{this.hover=false;this.mouse.x=0;this.mouse.y=0;this.mouse.px=-9999;this.mouse.py=-9999};
    if(!this.raf)this.loop()},
  resize(reseed){if(!this.el)return;const w=this.el.clientWidth,h=this.el.clientHeight;const changed=w!==this.w||h!==this.h;
    this.w=w;this.h=h;this.dpr=Math.min(2,window.devicePixelRatio||1);this.cv.width=w*this.dpr;this.cv.height=h*this.dpr;
    if(reseed||changed||!this.parts.length)this.seed(byId(HERO_IDS[S.heroIdx%HERO_IDS.length]),false)},
  seed(c,burst){const W=this.w,H=this.h,n=W<720?48:110,type=FXTYPE[c.id]||"light",cx=W/2,cy=H/2;this.type=type;this.c=c;
    this.parts=Array.from({length:n},()=>{const a=Math.random()*6.283,sp=3+Math.random()*10;return{x:burst?cx:Math.random()*W,y:burst?cy:Math.random()*H,bx:burst?Math.cos(a)*sp:0,by:burst?Math.sin(a)*sp:0,ox:0,oy:0,
      r:type==="bubble"?2+Math.random()*6:type==="ember"?1+Math.random()*2.2:1+Math.random()*2.6,v:.2+Math.random()*.7,ph:Math.random()*6.283,hue:Math.random()}});
    this.orbs=Array.from({length:W<720?4:7},()=>({tx:W*(.05+Math.random()*.9),ty:H*(.1+Math.random()*.8),r:40+Math.random()*90,d:Math.random()*2-1,ph:Math.random()*6.283,ox:0,oy:0,e:burst?1:0}));
    this.alpha=burst?0:1;this.mode=burst?"explode":"float"},
  async switchTo(i){
    const N=HERO_IDS.length;if(this.switching||!this.el)return;i=((i%N)+N)%N;if(i===S.heroIdx%N)return;
    this.switching=true;const from=byId(HERO_IDS[S.heroIdx%N]),to=byId(HERO_IDS[i]);S.heroIdx=i;
    const el=this.el,fc=heroCol(from),tc=heroCol(to);
    el.querySelectorAll(".hx-mini").forEach((b,k)=>{b.classList.toggle("on",k===i);b.setAttribute("aria-selected",k===i)});
    el.querySelector("#hxCount").textContent=`${i+1} / ${N}`;
    tween(1400,EASE.inOut2,p=>{el.style.setProperty("--h-in",mix(fc.in,tc.in,p));el.style.setProperty("--h-mid",mix(fc.mid,tc.mid,p));el.style.setProperty("--h-out",mix(fc.out,tc.out,p));el.style.setProperty("--h-acc",mix(fc.acc,tc.acc,p))});
    const text=el.querySelector("#hxText"),word=el.querySelector("#hxWord"),poster=el.querySelector("#hxPoster");
    const swap=()=>{poster.innerHTML=posterHTML(to,{big:true})+'<span class="hx-gloss"></span>';this.card.dataset.open=to.id;this.card.setAttribute("aria-label",L(to.title));
      text.innerHTML=heroTextHTML(to);word.textContent=REG[to.region].en.toUpperCase()};
    text.classList.add("out");word.classList.add("out");
    if(this.reduce){await tween(350,EASE.inOut2,()=>{});swap();this.seed(to,false);text.classList.remove("out");word.classList.remove("out");this.switching=false;this.lastAuto=performance.now();return}
    this.mode="implode";
    await tween(600,EASE.in2,p=>{this.spin=360*p;this.blur=14*p});
    swap();this.seed(to,true);text.classList.remove("out");word.classList.remove("out");
    await tween(1400,EASE.back,p=>{this.spin=360+360*p;this.blur=Math.max(0,14*(1-p))});
    this.spin=0;this.blur=0;this.switching=false;this.lastAuto=performance.now()},
  loop(){const st=now=>{this.raf=requestAnimationFrame(st);
      if(S.view!=="home"){cancelAnimationFrame(this.raf);this.raf=0;return}
      if(!this.el||!this.el.isConnected)return;this.step(now)};this.raf=requestAnimationFrame(st)},
  step(now){
    const ctx=this.ctx,W=this.w,H=this.h,t=now/1000,type=this.type,acc=this.c.c2,mx=this.mouse.px,my=this.mouse.py,cx=W/2,cy=H/2,still=this.reduce;
    this.cur.x+=(this.mouse.x-this.cur.x)*.06;this.cur.y+=(this.mouse.y-this.cur.y)*.06;
    if(this.card){const fy=still?0:Math.sin(t*1.05)*10;
      this.card.style.transform=`translateY(${fy}px) rotateZ(-4deg) rotateY(${this.cur.x*30+this.spin}deg) rotateX(${-this.cur.y*18}deg)`;
      this.card.style.filter=this.blur>.3?`blur(${this.blur.toFixed(1)}px)`:"none";
      this.card.style.setProperty("--gx",(40+this.cur.x*90)+"%");this.card.style.setProperty("--gy",(25+this.cur.y*70)+"%")}
    ctx.setTransform(this.dpr,0,0,this.dpr,0,0);ctx.clearRect(0,0,W,H);
    this.alpha=this.mode==="implode"?Math.max(0,this.alpha-.04):Math.min(1,this.alpha+.03);
    if(this.mode==="explode"&&this.alpha>=1)this.mode="float";
    ctx.globalCompositeOperation="lighter";
    for(const o of this.orbs){
      o.e=this.mode==="implode"?o.e+(1-o.e)*.14:o.e*.9;
      let bx=o.tx+(still?0:Math.sin(t*.5+o.ph)*14)+this.cur.x*70*o.d,by=o.ty+(still?0:Math.cos(t*.4+o.ph)*18)+this.cur.y*70*o.d;
      const dx=bx-mx,dy=by-my,d=Math.hypot(dx,dy)||1;let tx=0,ty=0;if(d<280){const f=(280-d)/280;tx=dx/d*f*80;ty=dy/d*f*80}
      o.ox+=(tx-o.ox)*.08;o.oy+=(ty-o.oy)*.08;bx+=o.ox;by+=o.oy;
      const x=bx+(cx-bx)*o.e,y=by+(cy-by)*o.e,r=Math.max(2,o.r*(1-o.e*.9));
      const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(acc,.26*this.alpha));g.addColorStop(1,rgba(acc,0));
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill()}
    for(const p of this.parts){
      if(!still){
        if(this.mode==="implode"){p.x+=(cx-p.x)*.12;p.y+=(cy-p.y)*.12}
        else{p.x+=p.bx;p.y+=p.by;p.bx*=.93;p.by*=.93;
          if(type==="ember"){p.y-=p.v*1.1;p.x+=Math.sin(t*2+p.ph)*.3}
          else if(type==="bubble"){p.y-=p.v*.9;p.x+=Math.sin(t+p.ph)*.25}
          else if(type==="wave"){p.x+=p.v*.8;p.y+=Math.sin(t*1.4+p.ph+p.x*.01)*.4}
          else{p.x+=Math.cos(p.ph+t*.2)*.15;p.y-=p.v*.25}
          if(p.y<-20)p.y=H+20;if(p.y>H+20)p.y=-20;if(p.x>W+20)p.x=-20;if(p.x<-20)p.x=W+20}
        const dx=p.x-mx,dy=p.y-my,d=Math.hypot(dx,dy)||1;let tx=0,ty=0;if(d<160){const f=(160-d)/160;tx=dx/d*f*50;ty=dy/d*f*50}
        p.ox+=(tx-p.ox)*.1;p.oy+=(ty-p.oy)*.1}
      const x=p.x+p.ox,y=p.y+p.oy,tw=.55+.45*Math.sin(t*2.2+p.ph*3);
      const a=this.alpha*(type==="ember"?tw:type==="light"?.35+.65*tw:.75);
      if(type==="bubble"){ctx.strokeStyle=rgba("#FFFFFF",.5*a);ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,p.r,0,6.283);ctx.stroke()}
      else{ctx.fillStyle=rgba(type==="ember"?(p.hue>.5?"#FFB347":acc):(p.hue>.62?"#FFFFFF":acc),a);ctx.beginPath();ctx.arc(x,y,p.r,0,6.283);ctx.fill()}}
    ctx.globalCompositeOperation="source-over";
    if(!this.switching&&!this.hover&&!M&&now-this.lastAuto>7000)this.switchTo(S.heroIdx+1)}
};
window.addEventListener("resize",()=>{if(Hero.el&&Hero.el.isConnected)Hero.resize(false);updHdr()});
function updHdr(){const h=document.getElementById("hdr"),hx=document.getElementById("hx");h.classList.toggle("over",!!(S.view==="home"&&hx&&window.scrollY<hx.offsetHeight-110))}
window.addEventListener("scroll",updHdr,{passive:true});

let UID=1;function addCart(it){it.uid=UID++;S.cart.push(it)}
function openDetail(id){S.detailId=id;S.booking={date:null,slot:null,qty:{}};go("detail")}
function newCode(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return `AXP-${s}-${String(Math.floor(Math.random()*9000)+1000)}`}

document.addEventListener("click",e=>{
  const m=e.target.closest("[data-m]");
  if(m&&M){const k=m.dataset.m,v=m.dataset.v;
    if(k==="bg"&&e.target!==m)return;
    if(k==="close"||k==="bg"){closeModal();return}
    if(k==="opt"){M.opt=+v}
    if(k==="receive"){M.receive=v;if(v==="pickup"&&!M.date)M.date=iso(addDays(3))}
    if(k==="qty"){M.qty=Math.max(1,Math.min(10,M.qty+ +v))}
    if(k==="copy"){try{navigator.clipboard.writeText(v).then(()=>toast(t("copied")),()=>toast(t("copied")))}catch(_){toast(t("copied"))}return}
    if(k==="addProd"){const p=prodById(M.id);const item={kind:p.kind,pid:p.id,qty:M.qty,receive:p.kind==="fnb"?"pickup":M.receive,venue:M.venue,date:M.receive==="pickup"||p.kind==="fnb"?M.date:null,opt:p.opts?p.opts[M.opt]:null};
      const same=S.cart.find(i=>i.pid===item.pid&&i.receive===item.receive&&i.venue===item.venue&&i.date===item.date&&L(i.opt)===L(item.opt));if(same)same.qty+=item.qty;else addCart(item);
      closeModal();toast(t("addedCart"));renderChrome();if(S.view==="cart")render();return}
    if(k==="addPkg"){const p=prodById(M.id);if(p.content&&!M.slot){toast(t("needSlot"));return}
      addCart({kind:"pkg",pid:p.id,qty:1,date:p.content?M.date:null,slot:p.content?M.slot:null,venue:p.region});closeModal();toast(t("addedCart"));renderChrome();return}
    renderModal();return}
  const g=e.target.closest("[data-go]");if(g){e.preventDefault();go(g.dataset.go);return}
  const o=e.target.closest("[data-open]");if(o){openDetail(o.dataset.open);return}
  const a=e.target.closest("[data-act]");if(!a)return;
  const k=a.dataset.act,v=a.dataset.v;const b=S.booking;
  switch(k){
   case "reset":{const l=S.lang;S=seed();S.lang=l;closeModal();go("home");return}
   case "heroGo":Hero.switchTo(+v);return;
   case "heroStep":Hero.switchTo(S.heroIdx+ +a.dataset.d);return;
   case "region":S.region=v;if(a.dataset.then){go(a.dataset.then);return}break;
   case "theme":S.theme=v;break;
   case "cat":S.cat=v;break;
   case "clearQ":S.q="";break;
   case "storeTab":S.storeTab=v;break;
   case "tkTab":S.tkTab=v;break;
   case "jump":{const el=document.getElementById(v);if(el)window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-120,behavior:"smooth"});document.querySelectorAll('[data-act="jump"]').forEach(x=>x.classList.toggle("on",x===a));return}
   case "date":b.date=v;b.slot=null;break;
   case "slot":b.slot=v;break;
   case "type":b.qty[v]=(b.qty[v]||0)+1;if(b.qty[v]>10)b.qty[v]=10;break;
   case "qty":b.qty[v]=Math.max(0,Math.min(10,(b.qty[v]||0)+ +a.dataset.d));if(!b.qty[v])delete b.qty[v];break;
   case "qtyDel":delete b.qty[v];break;
   case "addon":{const c=byId(S.detailId);const p=prodById(v);addCart({kind:p.kind,pid:p.id,qty:1,receive:"pickup",venue:c.region,date:b.date||iso(addDays(3)),opt:p.opts?p.opts[0]:null,fromDetail:c.id});toast(t("addedCart"));break}
   case "book":{const c=byId(S.detailId);if(c.type==="slot"&&(!b.date||!b.slot)){toast(t("needSlot"));return}
     if(!Object.values(b.qty).some(x=>x>0)){toast(t("needQty"));return}
     S.cart.forEach(i=>{if(i.fromDetail===c.id&&b.date)i.date=b.date});
     addCart({kind:"ticket",contentId:c.id,date:b.date,slot:b.slot,qty:{...b.qty}});S.booking={date:null,slot:null,qty:{}};
     if(v==="now"){go("checkout")}else{toast(t("addedCart"));render()}return}
   case "openProd":openModal({type:"prod",id:v});return;
   case "openPkg":openModal({type:"pkg",id:v});return;
   case "cqty":{const i=S.cart[+v];i.qty=Math.max(1,Math.min(10,i.qty+ +a.dataset.d));break}
   case "cdel":removeItems([+v]);return;
   case "cexcl":{const it=S.cart[+v];it.off=true;UNDO=null;EXCL=it;
     if(!act().length){go("cart");toast(t("excludedAll"));return}
     const y=window.scrollY;render();window.scrollTo(0,y);toast(t("excluded"),true,"undoExcl");return}
   case "undoExcl":if(EXCL){EXCL.off=false;EXCL=null;document.querySelector(".toast")?.remove()}break;
   case "delSel":removeItems(S.cart.map((i,ix)=>i.off?-1:ix).filter(ix=>ix>=0));return;
   case "delAll":removeItems(S.cart.map((_,ix)=>ix));return;
   case "undo":if(UNDO){UNDO.forEach(([ix,it])=>S.cart.splice(ix,0,it));UNDO=null;document.querySelector(".toast")?.remove()}break;
   case "tqty":{const i=S.cart[+v],k2=a.dataset.t;i.qty[k2]=Math.max(0,Math.min(10,(i.qty[k2]||0)+ +a.dataset.d));if(!i.qty[k2])delete i.qty[k2];if(!Object.keys(i.qty).length){removeItems([+v]);return}break}
   case "pm":S.pay=v;break;
   case "allPts":{S.usePoints=0;const x=totals();S.usePoints=x.maxPts>=1000?Math.floor(x.maxPts/100)*100:0;break}
   case "pay":{if(!document.getElementById("agree").checked){toast(t("needAgree"));return}
     a.disabled=true;a.textContent=t("paying");
     setTimeout(()=>{const x=totals();const no="AXP"+iso(todayD).replace(/-/g,"").slice(0,4)+"-"+iso(todayD).slice(5).replace("-","")+"-"+String(Math.floor(Math.random()*9000)+1000);
       const A=act();const onsite=A.filter(i=>i.kind==="goods"&&i.receive==="pickup"||i.kind==="fnb");
       A.forEach(i=>{
        if(i.kind==="ticket"){const c=byId(i.contentId);let first=true;
          c.prices.forEach(p=>{for(let n=0;n<(i.qty[p.k]||0);n++){const ex=first?onsite.filter(o=>o.venue===c.region).map(o=>({ko:prodById(o.pid).name.ko+" x"+o.qty,en:prodById(o.pid).name.en+" x"+o.qty})):[];first=false;
            S.tickets.unshift({code:newCode(),contentId:c.id,date:i.date||iso(addDays(1)),slot:i.slot||"",type:p.n,order:no,used:false,extras:ex})}})}
        if(i.kind==="pkg"){const p=prodById(i.pid);
          if(p.content)S.tickets.unshift({code:newCode(),contentId:p.content,date:i.date,slot:i.slot,type:{ko:"성인 (패키지)",en:"Adult (package)"},order:no,used:false,extras:(p.incl.ko.slice(1)).map((s,ix)=>({ko:s,en:p.incl.en[ix+1]}))});
          else ["lumen","king","manpa"].forEach(cid=>S.tickets.unshift({code:newCode(),contentId:cid,date:iso(addDays(90)),slot:"",type:{ko:"3도시 패스",en:"3-City Pass"},order:no,used:false,extras:[]}))}});
       const orphan=onsite.filter(o=>!A.some(i=>i.kind==="ticket"&&byId(i.contentId).region===o.venue));
       orphan.forEach(o=>{const p=prodById(o.pid);S.tickets.unshift({code:newCode(),contentId:null,title:p.name,date:o.date,slot:"",type:{ko:p.kind==="fnb"?"F&B 교환권":"굿즈 픽업권",en:p.kind==="fnb"?"F&B voucher":"Pickup voucher"},order:no,used:false,extras:[{ko:p.name.ko+" x"+o.qty,en:p.name.en+" x"+o.qty}]})});
       if(x.pts)S.ledger.push({d:iso(todayD),desc:{ko:"주문 결제 시 사용",en:"Used at checkout"},amt:-x.pts,st:"used"});
       S.ledger.push({d:iso(todayD),desc:{ko:`${no} 적립 예정`,en:`${no} pending`},amt:x.earn,st:"pending",order:no});
       S.member.points-=x.pts;S.member.spend+=x.pay;
       S.orders.unshift({no,d:iso(todayD),sum:x.pay,desc:{ko:`${A.length}건 주문`,en:`${A.length} items`}});
       S.lastOrder={no,sum:x.pay,earn:x.earn};S.cart=S.cart.filter(i=>i.off);S.coupon="";S.usePoints=0;S.agree=false;S.tkTab="up";go("done")},900);return}
   case "share":openModal({type:"share",code:v});return;
   case "scanCode":doScan(v);return;
   case "enter":{const tk=S.tickets.find(x=>x.code===v);if(tk){tk.used=true;const c=tk.contentId&&byId(tk.contentId);
     if(c&&!S.member.visited.includes(c.region))S.member.visited.push(c.region);
     const pend=S.ledger.find(l=>l.order===tk.order&&l.st==="pending");if(pend){pend.st="confirmed";pend.desc={ko:pend.desc.ko.replace("적립 예정","입장 적립"),en:pend.desc.en.replace("pending","entry")};S.member.points+=pend.amt}
     if(S.member.visited.length===3&&S.member.grade!=="BLACK"){S.member.grade="BLACK"}
     S.scanRes={cls:"ok",title:"✓ "+t("entered"),detail:`${tk.code} · ${c?esc(L(c.title)):""}${S.member.grade==="BLACK"?" · BLACK ↑":""}`,canEnter:false}}break}
  }
  render();
});
function doScan(code){
  code=(code||"").trim().toUpperCase();const tk=S.tickets.find(x=>x.code===code);
  if(!tk){S.scanRes={cls:"bad",title:"✕ "+t("scanNone"),detail:esc(code)};render();return}
  const c=tk.contentId?byId(tk.contentId):null;const venue=c?c.region:null;
  const info=`${tk.code} · ${c?esc(L(c.title)):esc(L(tk.title||""))} · ${tk.date?fmtDate(tk.date):""} ${tk.slot||""} · ${esc(L(tk.type))}${tk.extras.length?"<br>"+t("with")+": "+tk.extras.map(x=>esc(L(x))).join(", "):""}`;
  if(tk.used)S.scanRes={cls:"bad",title:"✕ "+t("scanUsed"),detail:info};
  else if(venue&&venue!==S.scanVenue)S.scanRes={cls:"warn",title:"! "+t("scanVenueMismatch"),detail:info+`<br>→ ${esc(L(VENUE[venue]))}`};
  else S.scanRes={cls:"ok",title:"✓ "+t("scanOk"),detail:info,canEnter:true,code:tk.code};
  render()}
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target.dataset.form;
  if(f==="search"){S.q=new FormData(e.target).get("q").trim();go("explore")}
  if(f==="scan"){doScan(new FormData(e.target).get("code"))}});
document.addEventListener("change",e=>{const k=e.target.dataset.change, mk=e.target.dataset.mchange;
  if(mk&&M){M[mk]=e.target.value;if(mk==="date")M.slot=M.slot&&prodById(M.id).content&&remain(prodById(M.id).content,M.date,M.slot)===0?null:M.slot;renderModal();return}
  if(!k)return;
  if(k==="lang"){S.lang=e.target.value;try{localStorage.setItem("axiplay-lang",S.lang)}catch(_){}}
  if(k==="region")S.region=e.target.value;
  if(k==="sort")S.sort=e.target.value;
  if(k==="coupon")S.coupon=e.target.value;
  if(k==="agree"){S.agree=e.target.checked;return}
  if(k==="ck"){S.cart[+e.target.dataset.v].off=!e.target.checked}
  if(k==="ckAll"){S.cart.forEach(i=>i.off=!e.target.checked)}
  if(k==="scanVenue"){S.scanVenue=e.target.value;S.scanRes=null}
  const y=window.scrollY;render();window.scrollTo(0,y)});
document.addEventListener("input",e=>{if(e.target.dataset.input==="points"){const x0=totals();let v=parseInt(e.target.value||"0",10)||0;S.usePoints=Math.max(0,v);
  clearTimeout(window._pt);window._pt=setTimeout(()=>{const x=totals();if(S.usePoints>x.maxPts)S.usePoints=x.maxPts;if(S.usePoints&&S.usePoints<1000)S.usePoints=0;const y=window.scrollY;render();window.scrollTo(0,y)},700)}});
